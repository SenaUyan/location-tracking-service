# Local / demo setup. One command: `docker compose up --build`
# Optional tracing UI:       `docker compose --profile observability up --build` (see README)

x-app: &app
  build: .
  image: location-tracking-service:local
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/location_tracking
    REDIS_URL: redis://redis:6379
    # Demo keys only – replace in any real deployment.
    API_KEY_ADMIN: dev-admin-key-change-me
    API_KEY_INGEST: dev-ingest-key-change-me
    STATE_TTL_SECONDS: 1800
    EXIT_BUFFER_METERS: 10
    MAX_FUTURE_SKEW_SECONDS: 300
    MAX_LOCATION_AGE_SECONDS: 86400
    RATE_LIMIT_LOCATIONS_PER_MINUTE: 60
    WORKER_CONCURRENCY: 20
    LOG_RETENTION_DAYS: 0
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: location_tracking
    # No host port on purpose: only api/worker/migrate talk to it, over the compose network.
    # This avoids clashes with a PostgreSQL already running on the host.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d location_tracking']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # AOF persistence: queued locations survive a Redis restart.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    # No host port on purpose (see postgres).
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off: applies migrations and loads demo areas, then exits.
  migrate:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'node dist/database/migrate.js && node dist/database/seed.js']
    environment:
      <<: *app-env
      SEED_DEMO_DATA: 'true'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ['node', 'dist/main.js']
    ports: ['3000:3000']
    environment:
      <<: *app-env
      OTEL_ROLE: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      OTEL_ROLE: worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Scale consumers independently of the API, e.g. `docker compose up --scale worker=4`
    deploy:
      replicas: 2
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP/HTTP

volumes:
  pgdata:
  redisdata:
